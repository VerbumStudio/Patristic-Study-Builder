<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;600;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 1080px;
      height: 1920px;
      background: radial-gradient(circle at 50% 15%, #0B132B 0%, #030712 65%, #000000 100%);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #F8FAFC;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 100px 70px 110px 70px;
      overflow: hidden;
      position: relative;
    }

    /* Ambient Neural Lighting */
    .circuit-glow {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 750px;
      height: 750px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.22) 0%, rgba(37, 99, 235, 0.08) 50%, transparent 75%);
      filter: blur(80px);
      pointer-events: none;
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }
    @keyframes pulseGlow {
      from { transform: translate(-50%, -50%) scale(0.9); opacity: 0.7; }
      to { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
    }

    /* Grid Overlay */
    .grid-mesh {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: 
        linear-gradient(rgba(56, 189, 248, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.04) 1px, transparent 1px);
      background-size: 70px 70px;
      pointer-events: none;
    }

    /* Top Identity Pill */
    .top-nav {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-pill {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 14px 28px;
      border-radius: 999px;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.2);
    }
    .brand-icon {
      width: 14px; height: 14px;
      background: #38BDF8;
      border-radius: 50%;
      box-shadow: 0 0 12px #38BDF8;
    }
    .brand-name {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #F8FAFC;
    }
    .badge-executive {
      font-size: 18px;
      font-weight: 700;
      color: #38BDF8;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 8px 16px;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    /* Hook Section */
    .hook-section {
      position: relative;
      z-index: 10;
      margin-top: 30px;
    }
    .hook-category {
      font-size: 22px;
      color: #38BDF8;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .hook-title {
      font-size: 60px;
      line-height: 1.18;
      font-weight: 800;
      letter-spacing: -1px;
    }
    .highlight-cyan {
      color: #38BDF8;
      text-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
    }

    /* 3D Product Showcase Window */
    .showcase-stage {
      position: relative;
      z-index: 10;
      height: 780px;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1000px;
    }
    .product-asset {
      max-width: 85%;
      max-height: 680px;
      object-fit: contain;
      filter: drop-shadow(0 25px 40px rgba(0, 0, 0, 0.85)) drop-shadow(0 0 45px rgba(56, 189, 248, 0.25));
      animation: floatDrift 5s ease-in-out infinite alternate;
    }
    @keyframes floatDrift {
      from { transform: translateY(0px) rotate(-1deg); }
      to { transform: translateY(-16px) rotate(1deg); }
    }

    /* Live Metric Overlays */
    .metric-card {
      position: absolute;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 18px;
      padding: 20px 28px;
      backdrop-filter: blur(14px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 6px;
      animation: cardPop 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .metric-1 {
      top: 60px;
      left: 10px;
    }
    .metric-2 {
      bottom: 80px;
      right: 10px;
    }
    .metric-label {
      font-size: 16px;
      color: #94A3B8;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .metric-value {
      font-size: 32px;
      font-weight: 800;
      color: #F8FAFC;
    }
    .metric-accent { color: #38BDF8; }

    /* Bottom High-Converting CTA */
    .cta-card {
      position: relative;
      z-index: 10;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.95));
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 24px;
      padding: 34px 44px;
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cta-text h3 {
      font-size: 28px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 4px;
    }
    .cta-text p {
      font-size: 20px;
      color: #94A3B8;
    }
    .cta-action {
      background: #38BDF8;
      color: #030712;
      font-weight: 800;
      font-size: 24px;
      padding: 16px 28px;
      border-radius: 14px;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="grid-mesh"></div>
  <div class="circuit-glow"></div>

  <!-- Header -->
  <div class="top-nav">
    <div class="brand-pill">
      <div class="brand-icon"></div>
      <span class="brand-name">WORKFLOW SUPER AI</span>
    </div>
    <div class="badge-executive">EXECUTIVE OS</div>
  </div>

  <!-- Hook -->
  <div class="hook-section">
    <div class="hook-category">System Architecture</div>
    <h1 class="hook-title">Automate 10+ Hours of <br>Work Every Week With <br><span class="highlight-cyan">Neural AI Systems</span></h1>
  </div>

  <!-- 3D Showcase Stage -->
  <div class="showcase-stage">
    <img src="assets/executive_ai_os.png" class="product-asset" alt="The Executive AI Operating System" />

    <div class="metric-card metric-1">
      <span class="metric-label">Triage Efficiency</span>
      <span class="metric-value metric-accent">+84% <span style="font-size: 20px; color: #94A3B8;">SPEED</span></span>
    </div>

    <div class="metric-card metric-2">
      <span class="metric-label">Executive Time Saved</span>
      <span class="metric-value">12.5 <span style="font-size: 20px; color: #38BDF8;">HRS/WK</span></span>
    </div>
  </div>

  <!-- CTA -->
  <div class="cta-card">
    <div class="cta-text">
      <h3>Steal the Complete Engine</h3>
      <p>Free Prompt Library & Guidebook</p>
    </div>
    <div class="cta-action">COMMENT "SYSTEM"</div>
  </div>

</body>
</html>
