name: Render Reel

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system tools
        run: |
          sudo apt update
          sudo apt install -y ffmpeg imagemagick fonts-dejavu-core
          sudo sed -i 's/<policy domain="path" rights="none" pattern="@\*"/<!-- & -->/' /etc/ImageMagick-6/policy.xml || true

      - name: Install Python packages
        run: |
          pip install edge-tts moviepy==1.0.3 pillow

      - name: Run render
        run: python render.py

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: guilt-driven-yes-reel
          path: guilt_driven_yes_master.mp4
