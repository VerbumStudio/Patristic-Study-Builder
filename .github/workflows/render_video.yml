name: Render Reel

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system tools
        run: |
          sudo apt update
          sudo apt install -y ffmpeg imagemagick fonts-dejavu-core curl
          sudo sed -i 's/<policy domain="path" rights="none" pattern="@\*"/<!-- & -->/' /etc/ImageMagick-6/policy.xml || true

      - name: Download Tech Synth Audio Track
        run: |
          curl -L -f -o background_music.mp3 "https://cdn.uppbeat.io/audio-files/19bdfb1322cfd8212e3e8f96e42b2923/6eb4a2d3989c4240a5a3a2ebf9f70b21/6803730be780f2d84db1304561b65eec/STREAMING-dark-synthwave-cyberpunk-techno-alec-szymanski-1-02-17.mp3" || \
          curl -L -f -o background_music.mp3 "https://ia801503.us.archive.org/15/items/free-cyber-synth-pulse/cyber_pulse.mp3"
          ls -lh background_music.mp3

      - name: Install Python packages
        run: |
          pip install edge-tts moviepy==1.0.3 pillow

      - name: Run render
        run: python render.py

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: guilt-driven-yes-reel
          path: guilt_driven_yes_master.mp4
