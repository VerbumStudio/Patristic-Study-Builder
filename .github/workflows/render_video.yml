name: Generate Campaign Video

on:
  workflow_dispatch:

jobs:
  render-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml || true
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-7/policy.xml || true

      - name: Install Python Dependencies
        run: |
          pip install moviepy imageio-ffmpeg

      - name: Render Video
        run: python3 render.py

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: morning_triage_video
          path: output_reel.mp4
